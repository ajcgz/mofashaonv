<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<script>
/* 先套主題，避免深色環境下閃一下白 */
(function () {
  try {
    var t = localStorage.getItem("oc-world:theme");
    if (t !== "dark" && t !== "light") {
      t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
    document.documentElement.style.colorScheme = t;
  } catch (e) { /* 忽略 */ }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OC 世界觀</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/features.css">
</head>
<body>

<!-- 宿命層：紙紋、暗角、邊界線、頁首刻度 -->
<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="margin-rule" aria-hidden="true"></div>
<div class="rewind-band" aria-hidden="true"><i></i></div>
<div class="curtain" id="curtain" aria-hidden="true"><span>載入檔案</span></div>

<header class="topbar">
  <a class="brand" href="#/"><span class="brand-mark"></span><span id="brandName">OC 世界觀</span></a>
  <nav class="nav" id="nav">
    <a href="#/" data-view="home">總覽</a>
    <a href="#/characters" data-view="characters">人物</a>
    <a href="#/graph" data-view="graph">關係圖</a>
    <a href="#/timeline" data-view="timeline">時間綫</a>
    <a href="#/map" data-view="map">地圖</a>
    <a href="#/gallery" data-view="gallery">畫廊</a>
    <a href="#/wiki" data-view="wiki">百科</a>
    <a href="#/music" data-view="music">音樂</a>
    <a href="#/stories" data-view="stories">故事</a>
    <a href="#/game" data-view="game">文遊</a>
  </nav>
  <div class="top-actions">
    <span class="hud" id="hud"></span>
    <span class="ro-tag" id="roTag" hidden>唯讀發佈版</span>
    <button id="searchBtn" class="btn" title="全站搜尋">🔍</button>
    <button id="backupBtn" class="btn" title="下載資料備份（world.data.json）">⬇</button>
    <button id="themeBtn" class="btn" title="切換深色／淺色">◐</button>
    <button id="editToggle" class="btn" hidden>編輯模式</button>
  </div>
</header>

<main id="view" class="view">
  <div class="loading">讀取中…</div>
</main>

<div id="modalHost"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input id="fileInput" type="file" accept="image/*" hidden>
<input id="audioInput" type="file" accept="audio/*" hidden>

<script src="assets/app.js"></script>
</body>
</html>
